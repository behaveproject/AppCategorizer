name: Publish to PyPI

# Placeholder workflow — NOT active yet.
# Before this can publish you must:
#   1. Create a PyPI account and register the "appcategorizer" project.
#   2. Set up Trusted Publishing (OIDC) for this repo + workflow on PyPI,
#      or add a PYPI_API_TOKEN secret and switch to token auth.
# Until then it only runs manually or on a published release (none exist yet),
# so it will not fire by accident.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
